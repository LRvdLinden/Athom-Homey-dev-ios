name: Status push

# Checks the build status of your Homey apps every 30 minutes and sends a push
# through OneSignal when something changed (draft, Test, in review, approved,
# rejected, Live). Needs the repository secrets HOMEY_PATS and ONESIGNAL_API_KEY.

on:
  schedule:
    # Every 30 minutes: fits the 2,000 free Actions minutes of a private repo.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test push to every account"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # to delete the previous status cache

concurrency:
  group: status-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous status
        uses: actions/cache/restore@v4
        with:
          path: .notify-state
          key: notify-state-${{ github.run_id }}
          restore-keys: notify-state-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check apps and send pushes
        run: node notify/notify.mjs
        env:
          HOMEY_PATS: ${{ secrets.HOMEY_PATS }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || '23f09f93-060f-4aa4-bde2-d11cf1e49be0' }}

      - name: Save status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .notify-state
          key: notify-state-${{ github.run_id }}

      # Caches can't be overwritten, so each run saves a new one; keep only the newest.
      - name: Remove older status caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key notify-state- --limit 100 --json key --jq '.[].key' \
            | grep -v "^notify-state-${{ github.run_id }}$" \
            | while read -r key; do gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || true; done
