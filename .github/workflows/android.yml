name: Android APK

# Builds the Android app in android/ into a signed APK, attaches it to the
# release "android-v<version>" and pushes the APK and the build log to the
# android-ci branch.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        id: build
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Push APK and log to android-ci branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp build.log out/build.log || true
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -400 > out/errors.txt || true
          echo "${{ steps.build.outcome }} ${{ github.sha }} ${{ steps.version.outputs.name }}" > out/status.txt
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/HomeyDev-${{ steps.version.outputs.name }}.apk"
          fi
          cd out
          git init -q
          git checkout -q -b android-ci
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Android build ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-ci

      - name: Attach APK to release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.version.outputs.name }}"
          APK="HomeyDev-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "${{ github.sha }}" --prerelease \
              --title "Android ${{ steps.version.outputs.name }}" \
              --notes "Android APK of Developer Tools for Homey ${{ steps.version.outputs.name }}. Install on your phone or tablet (allow installing from this source)."
          fi

      - name: Fail when the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
